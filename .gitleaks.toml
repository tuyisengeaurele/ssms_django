title = "SSMS gitleaks settings"

[extend]
useDefault = true

# Values made up for one CI run. ci.yml says they protect nothing, and they are written in a form no real key has.
# An entry goes here only after a person has read the finding and written the reason. A real secret is never listed:
# it is rotated.
[allowlist]
description = "Throwaway values used by CI"
# Zebra-Quartz-84 is the made-up password the tests use to register and sign in test accounts (24 places in the tests, none
# in the app). It sits next to the word "password:" in a request body, so the generic rule reads it as a key. It opens nothing.
regexes = ['''ci-only-[a-z-]+-that-protects-nothing''', '''Zebra-Quartz-84''']
paths = ['''\.github/workflows/ci\.yml''']
