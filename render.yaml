##############################################################################
# render.yaml: the two web services Render runs.
#
# Where everything lives:
#   website            Vercel (it also forwards /api to ssms-api, so the browser sees one site)
#   ssms-api           Render, this file
#   ssms-ai            Render, this file (the disease check)
#   database           Supabase Postgres (DATABASE_URL is pasted by hand, never committed)
#   scheduled jobs     GitHub Actions (.github/workflows/jobs-*.yml)
#   photos             Cloudinary
#
# Values marked "sync: false" are asked for in the Render dashboard and never stored in git.
# The full runbook is docs/deploy-runbook.md.
##############################################################################

services:
  - type: web
    name: ssms-api
    runtime: python
    region: frankfurt
    plan: free              # sleeps after 15 minutes without a visit and wakes in about a minute
    buildCommand: "./build.sh"
    startCommand: "bash start.sh"
    healthCheckPath: /api/health

    envVars:
      - key: PYTHON_VERSION
        value: "3.13.2"

      # One worker keeps the free 512 MB from running out. Raise it on a bigger plan.
      - key: WEB_CONCURRENCY
        value: "1"

      # ── Django core ──────────────────────────────────────────────────────────
      - key: SECRET_KEY
        sync: false    # the same value as the GitHub secret of this name

      - key: DEBUG
        value: false

      - key: DJANGO_ENV
        value: production

      - key: ALLOWED_HOSTS
        value: "ssms-api.onrender.com"

      # ── Database: Supabase, session mode pooler, with ?sslmode=require ───────
      - key: DATABASE_URL
        sync: false

      # ── JWT ─────────────────────────────────────────────────────────────────
      - key: JWT_SECRET
        sync: false    # the same value as the GitHub secret of this name

      # Two hops sit in front of the API: Vercel forwards the call and Render's load balancer receives it.
      # Without this every visitor shares one address and one rate limit.
      - key: TRUSTED_PROXY_COUNT
        value: "2"

      # ── Website ──────────────────────────────────────────────────────────────
      - key: CORS_ALLOWED_ORIGINS
        value: "https://ssms.vercel.app"

      - key: FRONTEND_URL
        value: "https://ssms.vercel.app"

      # The API's own public address, so the Health tab can ask it from outside.
      - key: HEALTH_API_URL
        value: "https://ssms-api.onrender.com"

      # ── Email (Gmail SMTP) ───────────────────────────────────────────────────
      - key: EMAIL_HOST_USER
        value: "smartsericulturerw@gmail.com"

      - key: EMAIL_HOST_PASSWORD
        sync: false

      - key: DEFAULT_FROM_EMAIL
        value: "SSMS <smartsericulturerw@gmail.com>"

      # ── Cloudinary ───────────────────────────────────────────────────────────
      - key: CLOUDINARY_CLOUD_NAME
        value: "dsmpn69ux"

      - key: CLOUDINARY_UPLOAD_PRESET
        value: "ssms_images"

      # ── Disease check service ────────────────────────────────────────────────
      - key: AI_SERVICE_URL
        value: "https://ssms-ai.onrender.com"

      - key: AI_SERVICE_SECRET
        sync: false    # the same value goes into ssms-ai

      # ── Sentry (optional) ────────────────────────────────────────────────────
      - key: SENTRY_DSN
        sync: false

  - type: web
    name: ssms-ai
    runtime: python
    region: frankfurt
    plan: free              # may need a paid plan: the model can use more memory than the free 512 MB
    buildCommand: "bash ai_service/build.sh"
    startCommand: "cd ai_service && uvicorn main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health

    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"

      - key: AI_SERVICE_SECRET
        sync: false    # the same value as in ssms-api

      # Where the build downloads the model from, and the fingerprint it must match.
      - key: MODEL_URL
        sync: false

      - key: MODEL_SHA256
        sync: false
