name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ssms_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Throw-away values for this run only. Real secrets never belong in this file.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/ssms_ci
      SECRET_KEY: ci-only-secret-key-that-protects-nothing-0123456789abcdef0123456789
      JWT_SECRET: ci-only-jwt-secret-that-protects-nothing-0123456789abcdef
      DEBUG: 'True'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint with ruff
        run: ruff check .
      - name: Audit Python packages
        run: pip-audit -r requirements.txt
      - name: Django deploy check
        env:
          DEBUG: 'False'
          ALLOWED_HOSTS: ssms.example.test
          TRUSTED_PROXY_COUNT: '1'
        run: python manage.py check --deploy --fail-level WARNING
      - name: Tests with the 80 percent coverage gate
        run: python -m pytest -q --cov --cov-report=term-missing:skip-covered --cov-fail-under=80

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install packages
        run: npm ci
      - name: Lint with ESLint
        run: npm run lint
      - name: Type check
        run: npx tsc --noEmit
      - name: Tests
        run: npm run test
      - name: Build
        run: npm run build
      - name: Audit packages that ship to the browser
        run: npm audit --omit=dev --audit-level=moderate
