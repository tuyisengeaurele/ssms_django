name: Sensor Simulation

# Manual only. It writes made-up readings into the database in DATABASE_URL, so it must never run by itself
# against a database that holds real farm data. Press "Run workflow" on a test site when you want demo readings.

on:
  workflow_dispatch:

jobs:
  simulate:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      DEBUG: "False"
      ALLOWED_HOSTS: "*"
      DJANGO_SETTINGS_MODULE: ssms_django.settings

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run sensor simulation
        run: python manage.py simulate_sensors
