name: Security

# Scans for mistakes that tests do not catch: risky code patterns, secrets that slipped into a commit, known problems in
# dependencies. It also runs every Monday, so a new advisory shows up without waiting for a pull request.

on:
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bandit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install bandit
        run: pip install bandit
      - name: Scan the Python code for medium and high risks
        run: bandit -q -r alerts audit_log batches contacts cooperatives core farms harvest locations logs reports sensors supply support_access users ssms_django scripts -ll --ini .bandit

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Look for secrets in the history
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@v3

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Pull requests already run these two audits in ci.yml. This copy is for the weekly and manual runs.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit Python packages
        run: pip install pip-audit && pip-audit -r requirements.txt
      - name: Audit packages that ship to the browser
        run: cd frontend && npm ci && npm audit --omit=dev --audit-level=moderate
