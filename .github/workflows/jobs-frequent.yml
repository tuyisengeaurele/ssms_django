name: Frequent jobs

# Every five minutes: ask the services how they are, look for bursts of errors, and mark silent devices offline.
# GitHub may start a run a few minutes late. That is fine for these jobs.
# The disease check service is left out of the health run, because asking it would wake it and use up Render's free hours.

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: jobs-frequent
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      DEBUG: "false"
      ALLOWED_HOSTS: "*"
      FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
      HEALTH_API_URL: ${{ secrets.HEALTH_API_URL }}
      AI_SERVICE_URL: ${{ secrets.AI_SERVICE_URL }}
      AI_SERVICE_SECRET: ${{ secrets.AI_SERVICE_SECRET }}
      EMAIL_HOST_USER: ${{ secrets.EMAIL_HOST_USER }}
      EMAIL_HOST_PASSWORD: ${{ secrets.EMAIL_HOST_PASSWORD }}
      DEFAULT_FROM_EMAIL: ${{ secrets.DEFAULT_FROM_EMAIL }}
      CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
      CLOUDINARY_UPLOAD_PRESET: ${{ secrets.CLOUDINARY_UPLOAD_PRESET }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # The API is pinged only from 04:00 to 18:00 UTC, which is 06:00 to 20:00 in Rwanda. At night it sleeps, which keeps
      # Render's 750 free hours a month for all the services. GitHub starts scheduled runs late or not at all (4 runs in
      # 20 hours was seen), so this ping cannot keep the API awake. An outside pinger does that, see the runbook.
      - name: Check the services
        run: python manage.py run_health_checks --skip aiService --awake-hours-utc 4-18

      - name: Look for bursts of errors
        run: python manage.py check_log_bursts

      - name: Mark silent devices offline
        run: python manage.py mark_offline_devices
